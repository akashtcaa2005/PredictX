# nginx reverse proxy for the polybot dashboard.
#
#   sudo cp deploy/nginx/polybot-dashboard.conf /etc/nginx/sites-available/polybot
#   sudo ln -s /etc/nginx/sites-available/polybot /etc/nginx/sites-enabled/polybot
#   sudo certbot --nginx -d dashboard.example.com     # issues + wires up the cert
#   sudo nginx -t && sudo systemctl reload nginx
#
# The dashboard itself binds 127.0.0.1 only, so nginx is the sole public surface.

# Bound login attempts at the edge as well as in the app.
limit_req_zone $binary_remote_addr zone=polybot_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=polybot_api:10m   rate=30r/s;

upstream polybot_dashboard {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.com;

    # ACME challenges stay on :80; everything else is redirected.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.example.com;

    # certbot fills these in; replace the paths if you manage certs yourself.
    ssl_certificate     /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:polybot_ssl:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 4m;      # journal screenshots are capped at 2 MB
    server_tokens off;

    access_log /var/log/nginx/polybot-access.log;
    error_log  /var/log/nginx/polybot-error.log warn;

    location / {
        proxy_pass http://polybot_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 65s;
    }

    # The snapshot stream: no buffering, long-lived upgrade.
    location /ws {
        proxy_pass http://polybot_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/auth/login {
        limit_req zone=polybot_login burst=5 nodelay;
        proxy_pass http://polybot_dashboard;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=polybot_api burst=60 nodelay;
        proxy_pass http://polybot_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location /static/ {
        proxy_pass http://polybot_dashboard;
        proxy_set_header Host $host;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }
}
